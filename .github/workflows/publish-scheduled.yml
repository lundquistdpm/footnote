name: Publish scheduled editions

on:
  schedule:
    # Every Monday from 6:07 AM to 6:37 PM Central Daylight Time, twice an hour.
    # GitHub's scheduler often runs late or skips runs at the top of the hour
    # (Oct 5, 2026: the 6 AM run fired at 2:25 PM), so runs sit off the hour and
    # repeat all day. The script is safe to rerun; it does nothing once published.
    # After Nov 1 (Standard Time) change 11-23 to 12-23 to keep the 6 AM start.
    - cron: '7,37 11-23 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish anything that is due
        run: python scripts/publish_due.py
      - name: Commit and push
        id: commit
        run: |
          git config user.name "footnote-publisher"
          git config user.email "footnote-publisher@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing due."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish scheduled edition"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the push may still trigger it."
